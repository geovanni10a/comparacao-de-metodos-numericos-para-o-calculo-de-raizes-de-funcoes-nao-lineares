[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raizes-numericas"
version = "1.0.0"
description = "Comparação de Métodos Numéricos para o Cálculo de Raízes de Funções Não Lineares: Uma Implementação em Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "geovanni10a" }]
keywords = ["cálculo numérico", "raízes de funções", "bisseção", "newton-raphson", "secante"]
dependencies = ["matplotlib==3.11.2"]

[project.urls]
Repository = "https://github.com/geovanni10a/comparacao-de-metodos-numericos-para-o-calculo-de-raizes-de-funcoes-nao-lineares"
